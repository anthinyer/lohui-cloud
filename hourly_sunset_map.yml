name: LOHUI Hourly Cloud Vividness Map & 337-City Sync

on:
  schedule:
    # 每小时整点自动运行一次 (UTC 0~23点 = 北京时间 08:00~次日07:00 全天候每小时更新)
    # GitHub Actions 公开仓库享受永久免费无限时长 (Unlimited Free Minutes)，非限时试用
    - cron: '0 * * * *'
  workflow_dispatch: # 支持在 GitHub Actions 页面随时手动点击 Run workflow 立即触发

permissions:
  contents: write

jobs:
  render-and-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 1. 检出仓库代码
        uses: actions/checkout@v4

      - name: 2. 配置 Python 3.11 科学计算环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 3. 安装 NumPy / SciPy / Matplotlib 及中文字体支持
        run: |
          sudo apt-get update -y
          sudo apt-get install -y fonts-noto-cjk
          pip install numpy scipy matplotlib

      - name: 4. 执行 1,247 控制点四源采集 + 500km 连续光路追踪 + Gitee 云端同步
        env:
          TZ: Asia/Shanghai
          GITEE_OWNER: ${{ secrets.GITEE_OWNER || 'anthinyer' }}
          GITEE_REPO: ${{ secrets.GITEE_REPO || 'lohui-map' }}
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN || 'd80764b6192c664e0bfc2c555a95f03e' }}
        run: |
          TODAY_BJ=$(TZ=Asia/Shanghai date +%Y-%m-%d)
          python3 pc_sunsetbot_renderer.py --date "$TODAY_BJ" --event all --cli

      - name: 5. 自动保活机制 (防止 GitHub 连续 60 天无提交自动休眠 Cron)
        run: |
          NOW_BJ=$(TZ=Asia/Shanghai date "+%Y-%m-%d %H:%M:%S")
          echo "Last Cloud Sync (UTC+8): $NOW_BJ" > .last_cloud_sync_heartbeat.txt
          git config user.name "LOHUI-Cloud-Bot"
          git config user.email "bot@lohui.local"
          git add .last_cloud_sync_heartbeat.txt
          git diff --staged --quiet || git commit -m "chore: hourly cloud sync heartbeat ($NOW_BJ)"
          git push || true
