name: LOHUI Hourly Cloud Vividness Map & 337-City Sync

on:
  push:
    paths:
      - '.github/workflows/hourly_sunset_map.yml'
      - 'pc_sunsetbot_renderer.py'
  workflow_dispatch:
  schedule:
    - cron: '8 * * * *'
    - cron: '23 * * * *'
    - cron: '38 * * * *'
    - cron: '53 * * * *'

concurrency:
  group: lohui-hourly-cloud-sync
  cancel-in-progress: ${{ github.event_name != 'schedule' }}

permissions:
  contents: write
  actions: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  render-and-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - name: 1. 检出仓库代码
        uses: actions/checkout@v4

      - name: 2. 启用独立 Python 3.11 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 3. 1秒预检云端新鲜度 (跨整点强制放行，仅同小时且 <25 分钟才跳过)
        id: check_freshness
        env:
          EVENT_NAME: ${{ github.event_name }}
          GITEE_OWNER: ${{ secrets.GITEE_OWNER || 'anthinyer' }}
          GITEE_REPO: ${{ secrets.GITEE_REPO || 'lohui-map' }}
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN || 'd80764b6192c664e0bfc2c555a95f03e' }}
        run: |
          python3 - << 'PYEOF'
          import os, json, time, urllib.request, ssl
          from datetime import datetime, timezone, timedelta
          ev = os.environ.get("EVENT_NAME", "")
          owner = os.environ.get("GITEE_OWNER", "anthinyer")
          repo = os.environ.get("GITEE_REPO", "lohui-map")
          tok = os.environ.get("GITEE_TOKEN", "")
          gh_out = os.environ.get("GITHUB_OUTPUT", "")
          should_run = "true"
          bj_tz = timezone(timedelta(hours=8))
          now_bj = datetime.now(bj_tz)
          if ev == "schedule":
              try:
                  url = f"https://gitee.com/api/v5/repos/{owner}/{repo}/commits?path=vividness_grid_latest.json&page=1&per_page=1&access_token={tok}&_t={int(time.time())}"
                  req = urllib.request.Request(url, headers={"User-Agent": "LOHUI-Cloud-Check/1.0"})
                  with urllib.request.urlopen(req, timeout=8, context=ssl.create_default_context()) as resp:
                      arr = json.loads(resp.read().decode("utf-8"))
                      if isinstance(arr, list) and arr:
                          c_date = ((arr[0].get("commit") or {}).get("committer") or {}).get("date") or ""
                          if c_date:
                              dt = datetime.fromisoformat(c_date.replace("Z", "+00:00")).astimezone(bj_tz)
                              age_min = (now_bj.timestamp() - dt.timestamp()) / 60.0
                              same_hour = (now_bj.strftime("%Y-%m-%d %H") == dt.strftime("%Y-%m-%d %H"))
                              print(f"[预检] Gitee 最新提交: {dt.strftime('%Y-%m-%d %H:%M:%S')} (距今 {age_min:.1f} 分钟, 同整点={same_hour})")
                              if same_hour and age_min < 25.0:
                                  print(">>> 当前整点内刚刚同步过 (<25分钟)，本次备份脉冲快速跳过！")
                                  should_run = "false"
                              else:
                                  print(">>> 已跨入新整点或距上次更新 >=25 分钟，立即执行本轮全量同步！")
              except Exception as e:
                  print(f"[预检提示] 继续执行全量解算: {e}")
          if gh_out:
              with open(gh_out, "a", encoding="utf-8") as f:
                  f.write(f"should_run={should_run}\n")
          PYEOF

      - name: 4. 安装科学计算依赖与中文字体支持
        if: steps.check_freshness.outputs.should_run == 'true'
        run: |
          sudo apt-get update -y || true
          sudo apt-get install -y fonts-noto-cjk || true
          pip install numpy scipy matplotlib

      - name: 5. 准点全量解算推送 + 4小时常驻护航 (彻底根除 GitHub 高峰期漏跑 3~5 小时)
        if: steps.check_freshness.outputs.should_run == 'true'
        env:
          TZ: Asia/Shanghai
          PYTHONUNBUFFERED: "1"
          GITEE_OWNER: ${{ secrets.GITEE_OWNER || 'anthinyer' }}
          GITEE_REPO: ${{ secrets.GITEE_REPO || 'lohui-map' }}
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN || 'd80764b6192c664e0bfc2c555a95f03e' }}
        run: |
          for cycle in 1 2 3 4; do
            TODAY_BJ=$(TZ=Asia/Shanghai date +%Y-%m-%d)
            NOW_BJ=$(TZ=Asia/Shanghai date "+%Y-%m-%d %H:%M:%S")
            echo ">>> [Cycle ${cycle}/4] 启动云端高精渲染与 337 城同步 (北京时间: ${NOW_BJ})"
            timeout --kill-after=15s 540s python3 -u pc_sunsetbot_renderer.py --date "$TODAY_BJ" --event all --cli || true
            DONE_BJ=$(TZ=Asia/Shanghai date "+%Y-%m-%d %H:%M:%S")
            echo ">>> [Cycle ${cycle}/4] Gitee 同步完成 (完成时间: ${DONE_BJ})"
            if [ "$cycle" -lt 4 ]; then
              SLEEP_SEC=$(python3 -c 'import time; m = int(time.strftime("%M")); s = int(time.strftime("%S")); rem = ((62 - m) % 60) * 60 - s; print(max(1200, rem if rem > 300 else rem + 3600))')
              echo ">>> 容器保活待命 ${SLEEP_SEC} 秒，将在下一整点 :02 准时自动执行下一轮同步（免疫 GitHub 队列漏跑）..."
              sleep "$SLEEP_SEC"
            fi
          done

      - name: 6. 更新仓库心跳并自动接力触发下一班工作流 (Workflow Dispatch Relay)
        if: steps.check_freshness.outputs.should_run == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          NOW_BJ=$(TZ=Asia/Shanghai date "+%Y-%m-%d %H:%M:%S")
          echo "Last Cloud Sync (UTC+8): $NOW_BJ" > .last_cloud_sync_heartbeat.txt
          git config user.name "LOHUI-Cloud-Bot"
          git config user.email "bot@lohui.local"
          git pull --rebase || true
          git add .last_cloud_sync_heartbeat.txt
          git diff --staged --quiet || git commit -m "chore: hourly cloud sync heartbeat ($NOW_BJ)"
          git push || true
          curl -sS -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            "https://api.github.com/repos/${GH_REPO}/actions/workflows/hourly_sunset_map.yml/dispatches" \
            -d '{"ref":"main"}' || true
