name: LOHUI Hourly Cloud Vividness Map & 337-City Sync

on:
  push:
    paths:
      - '.github/workflows/hourly_sunset_map.yml'
      - 'pc_sunsetbot_renderer.py'
  workflow_dispatch:
  schedule:
    # 每小时触发一次单轮独立任务，每次仅运行 3~4 分钟即完成并显示绿勾
    - cron: '5 * * * *'

concurrency:
  group: lohui-hourly-cloud-sync
  cancel-in-progress: ${{ github.event_name != 'schedule' }}

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  render-and-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: 1. 检出仓库代码
        uses: actions/checkout@v4

      - name: 2. 启用独立 Python 3.11 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 3. 安装科学计算依赖与中文字体支持
        run: |
          sudo apt-get update -y || true
          sudo apt-get install -y fonts-noto-cjk || true
          pip install numpy scipy matplotlib

      - name: 4. 单轮极速解算并推送至 Gitee (约 3~4 分钟即刻结束)
        env:
          TZ: Asia/Shanghai
          PYTHONUNBUFFERED: "1"
          GITEE_OWNER: ${{ secrets.GITEE_OWNER || 'anthinyer' }}
          GITEE_REPO: ${{ secrets.GITEE_REPO || 'lohui-map' }}
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN || 'd80764b6192c664e0bfc2c555a95f03e' }}
        run: |
          TODAY_BJ=$(TZ=Asia/Shanghai date +%Y-%m-%d)
          NOW_BJ=$(TZ=Asia/Shanghai date "+%Y-%m-%d %H:%M:%S")
          echo ">>> 启动单轮云端高精渲染与 337 城同步 (北京时间: ${NOW_BJ})"
          timeout --kill-after=10s 360s python3 -u pc_sunsetbot_renderer.py --date "$TODAY_BJ" --event all --cli
          DONE_BJ=$(TZ=Asia/Shanghai date "+%Y-%m-%d %H:%M:%S")
          echo ">>> 本轮渲染与 Gitee 同步全部完成 (完成时间: ${DONE_BJ})"

      - name: 5. 更新仓库心跳时间戳 (防止 GitHub 60天自动休眠定时任务)
        run: |
          NOW_BJ=$(TZ=Asia/Shanghai date "+%Y-%m-%d %H:%M:%S")
          echo "Last Cloud Sync (UTC+8): $NOW_BJ" > .last_cloud_sync_heartbeat.txt
          git config user.name "LOHUI-Cloud-Bot"
          git config user.email "bot@lohui.local"
          git add .last_cloud_sync_heartbeat.txt
          git diff --staged --quiet || git commit -m "chore: hourly cloud sync heartbeat ($NOW_BJ)"
          git push || true
