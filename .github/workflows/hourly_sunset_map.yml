name: LOHUI Hourly Cloud Vividness Map & 337-City Sync

on:
  push:
    paths:
      - '.github/workflows/hourly_sunset_map.yml'
      - 'pc_sunsetbot_renderer.py'
  workflow_dispatch:
  schedule:
    # 守护拉起脉冲：一旦容器启动，将在容器内常驻连续准点执勤 5 小时 (每小时 00分05秒 零延迟准时开跑)
    - cron: '7,37 * * * *'

concurrency:
  group: lohui-hourly-cloud-sync
  # 当手动触发或修改代码推送时立即接管旧容器(绝不卡在"未决"排队)；当定时脉冲触发时保留正在执勤的热容器
  cancel-in-progress: ${{ github.event_name != 'schedule' }}

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  render-and-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - name: 1. 检出仓库代码
        uses: actions/checkout@v4

      - name: 2. 启用独立 Python 3.11 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 3. 一次性安装科学计算依赖与中文字体支持 (常驻容器内免重复安装)
        run: |
          sudo apt-get update -y || true
          sudo apt-get install -y fonts-noto-cjk || true
          pip install numpy scipy matplotlib

      - name: 4. 立即执行首轮渲染 + 连续 5 小时整点(XX:00:05)零延迟准时同步引擎 (含 360s 进程级防卡死保护)
        env:
          TZ: Asia/Shanghai
          PYTHONUNBUFFERED: "1"
          GITEE_OWNER: ${{ secrets.GITEE_OWNER || 'anthinyer' }}
          GITEE_REPO: ${{ secrets.GITEE_REPO || 'lohui-map' }}
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN || 'd80764b6192c664e0bfc2c555a95f03e' }}
        run: |
          for ROUND in 1 2 3 4 5; do
            TODAY_BJ=$(TZ=Asia/Shanghai date +%Y-%m-%d)
            NOW_BJ=$(TZ=Asia/Shanghai date "+%Y-%m-%d %H:%M:%S")
            echo "=================================================================="
            echo ">>> [第 ${ROUND}/5 轮准点执勤] 启动时间 (北京时间): ${NOW_BJ}"
            echo "=================================================================="
            timeout --kill-after=10s 360s python3 -u pc_sunsetbot_renderer.py --date "$TODAY_BJ" --event all --cli || true

            DONE_BJ=$(TZ=Asia/Shanghai date "+%Y-%m-%d %H:%M:%S")
            echo ">>> [第 ${ROUND}/5 轮完成] 已推送至 Gitee (完成时间: ${DONE_BJ})"

            if [ "$ROUND" -lt 5 ]; then
              CUR_MIN=$(TZ=Asia/Shanghai date +%M)
              CUR_SEC=$(TZ=Asia/Shanghai date +%S)
              SLEEP_SEC=$(( (59 - 10#$CUR_MIN) * 60 + (60 - 10#$CUR_SEC) + 5 ))
              if [ "$SLEEP_SEC" -lt 60 ]; then
                SLEEP_SEC=$((SLEEP_SEC + 3600))
              fi
              NEXT_BJ=$(TZ=Asia/Shanghai date -d "+${SLEEP_SEC} seconds" "+%H:%M:%S" 2>/dev/null || echo "下一整点")
              echo ">>> 热容器待命中：将在 ${SLEEP_SEC} 秒后 (北京时间 ${NEXT_BJ}) 零延迟准时启动下一小时渲染..."
              sleep "$SLEEP_SEC"
            fi
          done
